[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-for-stock-market"
version = "0.1.0"
description = "Volatility forecasting project with GARCH and LSTM on KuCoin hourly BTC-USDT data."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
